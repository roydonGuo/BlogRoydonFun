<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <title>Roydon Blog daytime background</title>
  <defs>
    <linearGradient id="day-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#f3f7ff"/>
    </linearGradient>
    <radialGradient id="day-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9ec5ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9ec5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="day-glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b4a9ff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#b4a9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="day-ribbon-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c5ff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#9daeff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9bd5ff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="day-ribbon-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cabfff" stop-opacity="0.04"/>
      <stop offset="0.55" stop-color="#a7b6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#80c9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="day-wave-front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c6bfff" stop-opacity="0.46"/>
      <stop offset="0.52" stop-color="#b7ccff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9fdcff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="day-wave-back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfd9ff" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#d4eaff" stop-opacity="0.52"/>
    </linearGradient>
    <pattern id="day-dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#6683d8" fill-opacity="0.08"/>
    </pattern>
    <filter id="day-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="68"/>
    </filter>
    <linearGradient id="day-ribbon-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.20" stop-color="#ffffff"/>
      <stop offset="0.50" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="day-bottom-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="day-ribbon-mask" maskUnits="userSpaceOnUse" x="-200" y="70" width="2320" height="520">
      <rect x="-200" y="70" width="2320" height="520" fill="url(#day-ribbon-fade)"/>
    </mask>
    <mask id="day-bottom-mask" maskUnits="userSpaceOnUse" x="-100" y="900" width="2120" height="300">
      <rect x="-100" y="900" width="2120" height="300" fill="url(#day-bottom-fade)"/>
    </mask>
    <filter id="day-ribbon-soft" x="-15%" y="-35%" width="130%" height="170%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="day-wave-soft" x="-10%" y="-30%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#day-base)"/>
  <rect width="1920" height="1200" fill="url(#day-dots)" opacity="0.34"/>

  <g filter="url(#day-blur)">
    <ellipse cx="1450" cy="175" rx="500" ry="225" fill="url(#day-glow-blue)"/>
    <ellipse cx="480" cy="250" rx="420" ry="220" fill="url(#day-glow-violet)"/>
    <ellipse cx="960" cy="990" rx="640" ry="210" fill="url(#day-glow-blue)" opacity="0.52"/>
  </g>

  <g mask="url(#day-ribbon-mask)" filter="url(#day-ribbon-soft)">
    <path d="M-160 315C120 350 330 255 540 205c180-43 280-60 420-15 150 48 210 80 360 40 170-46 310-104 490-60 140 34 220 90 270 130v220H-160Z" fill="url(#day-ribbon-a)"/>
    <path d="M-160 385c280 45 490-85 730-145 190-47 330 52 510 92 170 38 310-66 470-102 210-49 380 30 530 125v215H-160Z" fill="url(#day-ribbon-b)"/>
  </g>
  <path d="M578 285c136-54 226-56 319-21 104 39 176 38 274-7 91-41 204-32 315 25" fill="none" stroke="#758bf4" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M154 171c53-40 128-51 187-27 46 19 81 16 113-7" stroke="#6985ed" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="5 12"/>
    <path d="m470 135 30 11-20 7-8 20-2-38Z" stroke="#7088f4" stroke-opacity="0.34" stroke-width="2"/>
    <path d="M1480 310c45-18 77-13 105 12 18 16 40 18 64 6" stroke="#7b8ff2" stroke-opacity="0.20" stroke-width="2"/>
    <path d="m1662 283 31 12-21 7-8 21-2-40Z" stroke="#7088f4" stroke-opacity="0.38" stroke-width="2"/>
  </g>

  <g fill="#5271f0">
    <path d="M118 235h8v8h-8z" opacity="0.20" transform="rotate(45 122 239)"/>
    <path d="M1761 186h10v10h-10z" opacity="0.16" transform="rotate(45 1766 191)"/>
    <circle cx="1810" cy="344" r="3" opacity="0.20"/>
    <circle cx="92" cy="394" r="3" opacity="0.20"/>
  </g>
  <g fill="#f5bd45" opacity="0.62">
    <path d="m432 202 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
    <path d="m1718 352 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
  </g>

  <g mask="url(#day-bottom-mask)" filter="url(#day-wave-soft)">
    <path d="M-40 1022c213 15 286 96 462 86 186-10 267-92 451-70 160 18 233 94 402 83 197-13 315-107 685-112v211H-40Z" fill="url(#day-wave-back)"/>
    <path d="M-40 1081c228-18 355 78 542 67 197-12 279-79 477-56 164 19 252 74 432 47 165-25 314-92 549-72v153H-40Z" fill="url(#day-wave-front)"/>
    <path d="M-40 1128c254-32 392 52 601 39 190-12 289-53 484-25 191 28 333 37 512-13 139-34 275-40 403-22v113H-40Z" fill="#e9f3ff" fill-opacity="0.76"/>
  </g>

  <g transform="translate(82 1070)" fill="none" stroke="#607be4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="42" cy="42" rx="31" ry="14" stroke-opacity="0.42" stroke-width="3" transform="rotate(-24 42 42)"/>
    <circle cx="42" cy="41" r="17" fill="#d8e5ff" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M35 26c5 7 8 13 6 29M51 28c-2 8-2 15 2 22M17 38c15 6 32 7 51-2" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="75" cy="10" r="3" fill="#55cfd2" stroke="none"/>
    <path d="m88 20 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#f4bf49" stroke="none"/>
  </g>
  <g transform="translate(1750 1080)" fill="none" stroke="#5e7bea" stroke-linecap="round" stroke-linejoin="round" opacity="0.66">
    <path d="M18 66c5-23 19-41 43-54 8 28 3 52-17 70l-26-16Z" fill="#e8efff" stroke-width="2"/>
    <circle cx="48" cy="39" r="8" fill="#a9c7ff" stroke-width="2"/>
    <path d="m22 64-13 13 22-3M45 80l-4 21 17-15" stroke-width="2"/>
    <path d="M16 84c-8 4-12 10-13 20 10-1 17-5 21-13" stroke="#f1aa48" stroke-width="4"/>
  </g>
</svg>
