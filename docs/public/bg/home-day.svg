<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"
     preserveAspectRatio="xMidYMid slice">
    <title>Roydon Blog home daytime background</title>
    <defs>
        <radialGradient id="home-day-violet" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#9078ff" stop-opacity="0.42"/>
            <stop offset="0.55" stop-color="#b6a6ff" stop-opacity="0.20"/>
            <stop offset="1" stop-color="#c9beff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="home-day-planet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#d7c0ff06" stop-opacity="0.48"/>
            <stop offset="0.62" stop-color="#c9b5ff" stop-opacity="0.32"/>
            <stop offset="1" stop-color="#b9d5ff" stop-opacity="0.14"/>
        </linearGradient>
        <linearGradient id="home-day-wave" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7da1f6" stop-opacity="0.06"/>
            <stop offset="0.48" stop-color="#8975ef" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#72bff3" stop-opacity="0.06"/>
        </linearGradient>
        <pattern id="home-day-dots" width="17" height="17" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.35" fill="#6683df" fill-opacity="0.22"/>
        </pattern>
        <filter id="home-day-blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="22"/>
        </filter>
        <filter id="home-day-soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6"/>
        </filter>
    </defs>

    <circle cx="1902" cy="245" r="250" fill="url(#home-day-planet)"/>
    <circle cx="1902" cy="245" r="216" fill="none" stroke="#ae97f7" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M1638 352c78-50 172-77 272-76" fill="none" stroke="#9b8bec" stroke-opacity="0.13" stroke-width="2"
          stroke-dasharray="2 11"/>

    <path d="M0 365c260 102 437 43 633 61 214 20 302 94 532 58 232-37 389-176 755-119" fill="none"
          stroke="url(#home-day-wave)" stroke-width="2"/>
    <path d="M0 398c278 78 449 30 639 55 215 28 322 75 532 38 241-42 405-157 749-102" fill="none" stroke="#8098ee"
          stroke-opacity="0.09" stroke-width="1.5"/>
    <path d="M0 426c267 60 459 21 649 53 192 32 324 52 523 10 230-48 411-130 748-76" fill="none" stroke="#66b7e9"
          stroke-opacity="0.08" stroke-width="1.5"/>

    <path d="M126 264C52 315 19 393 20 490c103 7 191-22 259-86" fill="url(#home-day-dots)" opacity="0.55"/>
    <path d="M1698 72c95-24 170-11 222 18v224c-68-55-138-94-226-108Z" fill="url(#home-day-dots)" opacity="0.45"/>

    <g filter="url(#home-day-soft)">
        <circle cx="174" cy="190" r="48" fill="#8e78f3" fill-opacity="0.30"/>
        <circle cx="1602" cy="187" r="28" fill="#78baff" fill-opacity="0.26"/>
        <circle cx="962" cy="182" r="14" fill="#80adff" fill-opacity="0.22"/>
    </g>

    <g fill="#8ca3f4">
        <circle cx="246" cy="382" r="8" opacity="0.22"/>
        <circle cx="944" cy="86" r="3" opacity="0.26"/>
        <circle cx="1478" cy="306" r="6" opacity="0.20"/>
        <circle cx="1513" cy="363" r="3" opacity="0.22"/>
    </g>
    <g transform="translate(-35 0)">
        <g fill="#765cf0">
            <circle cx="980" cy="282" r="9" opacity="0.54"/>
            <circle cx="982" cy="279" r="2.2" fill="#ffffff" opacity="0.42"/>
            <circle cx="1509" cy="246" r="12" opacity="0.46"/>
            <circle cx="1505" cy="242" r="2.8" fill="#ffffff" opacity="0.38"/>
        </g>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="1240" cy="299" rx="280" ry="112" stroke="#8c6cf1" stroke-opacity="0.20" stroke-width="2.5"
                     transform="rotate(-6 1240 299)"/>
            <ellipse cx="1240" cy="299" rx="230" ry="78" stroke="#76a7f4" stroke-opacity="0.14" stroke-width="2"
                     transform="rotate(8 1240 299)"/>
            <path d="m1502 321 11-2-6 10" stroke="#735ee8" stroke-opacity="0.24" stroke-width="3"/>
        </g>
    </g>

    <g transform="translate(1028 167)" opacity="0.38">
        <circle r="28" fill="#ffffff" stroke="#d9e4ff" stroke-width="1.5"/>
        <path d="m-9-5-8 8 8 8M9-5l8 8-8 8M4-13-7 17" fill="none" stroke="#607fff" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g fill="#f1c45b" opacity="0.62">
        <path d="m516 131 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
        <path d="m1658 474 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    </g>
    <g fill="#7058ee" opacity="0.58">
        <path d="m535 112 5 13 13 5-13 5-5 13-5-13-13-5 13-5Z"/>
        <path d="m566 93 3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    </g>

